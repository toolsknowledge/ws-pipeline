server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React app; fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend container.
    # In App.jsx, point requests at "/api/..." so Nginx can proxy them —
    # this avoids hardcoding the EC2 IP address in the frontend code.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
